# Публикация сайта на GitHub Pages.
#
# Сайт — обычные HTML, CSS и JS, собирать нечего: этот процесс берёт файлы
# репозитория как есть и отдаёт их Pages. Именно поэтому здесь нет ни npm,
# ни сборщика — та сборка, что пришла сюда из чужой заготовки, публиковала
# папку dist с одной страницей, без остальных страниц, фотографий и видео.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забрать файлы репозитория
        uses: actions/checkout@v4

      - name: Подготовить Pages
        uses: actions/configure-pages@v5

      - name: Упаковать сайт целиком
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
